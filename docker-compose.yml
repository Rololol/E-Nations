services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erepublik
      MYSQL_USER: enations
      MYSQL_PASSWORD: enations
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - enations-db:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      ENATIONS_DB_HOST: db
      ENATIONS_DB_NAME: erepublik
      ENATIONS_DB_USER: enations
      ENATIONS_DB_PASSWORD: enations
      ENATIONS_MODE: production
      ENATIONS_PASSWORD_HASH: change-this-salt
      ENATIONS_COOKIE_SECRET: change-this-cookie-secret
      ENATIONS_COOKIE_DOMAIN: ""
    volumes:
      - ./tmp:/var/www/html/tmp

volumes:
  enations-db:
